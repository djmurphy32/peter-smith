name: Build and Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Pnpm setup
        uses: pnpm/setup@v2.0.2

      - name: Build project
        run: pnpm build

      - name: Type check
        run: pnpm tsc

      - name: Lint code
        run: pnpm lint
